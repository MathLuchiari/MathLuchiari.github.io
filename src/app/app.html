@let d = data();
<a class="skip-link" href="#main">{{ ui().skipLink }}</a>

<app-site-header id="top" [brand]="d.profile.name" [items]="nav()" [cta]="contactNav()" />

<main id="main" class="container">
  <app-hero [profile]="d.profile" [primaryLink]="linkedIn()" />

  <app-experience id="experience" aria-labelledby="experience-h" role="region" [chapters]="d.experience" />
  <app-skills id="skills" aria-labelledby="skills-h" role="region" [groups]="d.skills" />
  <app-projects
    id="projects"
    aria-labelledby="projects-h"
    role="region"
    [projects]="projects()"
    [state]="projectsState()"
    [moreLink]="gitHub()"
  />
  <app-education
    id="education"
    aria-labelledby="education-h"
    role="region"
    [items]="d.education"
    [certifications]="d.certifications"
  />
  <app-contact id="contact" aria-labelledby="contact-h" role="region" [contact]="d.contact" />
</main>

<footer class="footer mono">© {{ year }} {{ d.profile.name }} · {{ ui().footer }}</footer>
