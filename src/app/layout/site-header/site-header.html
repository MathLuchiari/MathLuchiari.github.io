<header class="bar">
  <div class="container inner">
    <a class="brand display" href="#top" (click)="closeMenu()">{{ brand() }}</a>

    <div class="langs mono" role="group" [attr.aria-label]="ui().langLabel">
      @for (l of langs; track l.code) {
        <button
          type="button"
          [attr.lang]="l.code"
          [attr.aria-label]="l.name"
          [attr.aria-pressed]="lang() === l.code"
          (click)="setLang(l.code)"
        >
          {{ l.short }}
        </button>
      }
    </div>

    <button
      type="button"
      class="menu-toggle mono"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? ui().close : ui().menu }}
    </button>

    <nav id="primary-nav" class="nav mono" [class.open]="menuOpen()" [attr.aria-label]="ui().navLabel">
      @for (item of items(); track item.id) {
        <a
          [href]="'#' + item.id"
          [class.active]="active() === item.id"
          [attr.aria-current]="active() === item.id ? 'true' : null"
          (click)="closeMenu()"
          >{{ item.label }}</a
        >
      }
      <a
        class="cta"
        [href]="'#' + cta().id"
        [class.active]="active() === cta().id"
        (click)="closeMenu()"
        >{{ cta().label }}</a
      >
    </nav>
  </div>
</header>
